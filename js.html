<script>
    let currentUser = null;
    let currentAbsenType = 'MASUK';
    let capturedPhotoBase64 = '';
    let selectedProfilePhotoBase64 = '';
    let currentGeoLocation = '-7.6795781,108.4892786';
    let currentDistanceMeters = 0;
    let historyPage = 1;
    let webcamStream = null;

    // Dynamic Settings Variables (Default fallback INN Al-Farabi Pangandaran)
    let SCHOOL_LAT = -7.6795781;
    let SCHOOL_LNG = 108.4892786;
    let MAX_RADIUS_METERS = 200;
    let isGeofenceActive = true;

    // Leaflet Admin Map Variables
    let adminMap = null;
    let adminMarker = null;
    let adminCircle = null;

    let locationWatchId = null;
    // =========================================================================
    // DUAL-MODE API BRIDGE (GOOGLE APPS SCRIPT NATIVE & VERCEL / STANDALONE)
    // =========================================================================
    // URL Web App Google Apps Script (Deployment Exec URL).
    let GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx38_5x5SaC1AglvGqQrXoCq5ICWfCda8fZh1CjNXGtG7pU7LhZaeTIoV58_-rxs2jh/exec';

    // Cek parameter ?api= pada URL browser untuk kemudahan konfigurasi awal
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const queryApi = urlParams.get('api');
        if (queryApi && queryApi.startsWith('http')) {
            GAS_API_URL = queryApi.trim();
            localStorage.setItem('zettbot_gas_api_url', GAS_API_URL);
        }
    } catch (e) { }

    const isNativeGAS = typeof google !== 'undefined' && google.script && typeof google.script.run !== 'undefined';

    // Polyfill google.script.run untuk lingkungan eksternal (Vercel / Localhost)
    if (!isNativeGAS) {
        window.google = window.google || {};
        window.google.script = window.google.script || {};

        window.google.script.run = {
            _successHandler: null,
            _failureHandler: null,

            withSuccessHandler: function (handler) {
                const runner = Object.create(this);
                runner._successHandler = handler;
                return runner;
            },

            withFailureHandler: function (handler) {
                const runner = Object.create(this);
                runner._failureHandler = handler;
                return runner;
            },

            _callApi: function (action, payload) {
                const success = this._successHandler;
                const failure = this._failureHandler;

                let targetUrl = GAS_API_URL || localStorage.getItem('zettbot_gas_api_url') || '';
                if (!targetUrl) {
                    const promptVal = prompt('Aplikasi mendeteksi Anda berjalan di Vercel / luar Apps Script.\n\nSilakan masukkan URL Google Apps Script Web App Anda (akhiran /exec):');
                    if (promptVal && promptVal.trim().startsWith('http')) {
                        targetUrl = promptVal.trim();
                        localStorage.setItem('zettbot_gas_api_url', targetUrl);
                        GAS_API_URL = targetUrl;
                    } else {
                        const errMsg = 'URL Google Apps Script API belum diatur. Silakan atur GAS_API_URL.';
                        if (failure) failure(new Error(errMsg));
                        else if (typeof showToast === 'function') showToast(errMsg, 'error');
                        return;
                    }
                }

                const reqBody = Object.assign({ action: action }, payload);

                // Menggunakan text/plain agar tidak memicu CORS Preflight OPTIONS di browser
                fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(reqBody)
                })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP Status ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    if (success) success(data);
                })
                .catch(function (err) {
                    console.error('API Error [' + action + ']:', err);
                    if (failure) failure(err);
                    else if (typeof showToast === 'function') showToast('Gagal terhubung ke server: ' + err.message, 'error');
                });
            },

            loginUser: function (id, pass, role) {
                this._callApi('loginUser', { identifier: id, password: pass, selectedRole: role });
            },
            getSystemSettings: function () {
                this._callApi('getSystemSettings', {});
            },
            saveSystemSettings: function (payload) {
                this._callApi('saveSystemSettings', { payload: payload });
            },
            getTodayAbsensi: function (userId) {
                this._callApi('getTodayAbsensi', { userId: userId });
            },
            submitAbsen: function (payload) {
                this._callApi('submitAbsen', { payload: payload });
            },
            getAbsensiHistory: function (params) {
                this._callApi('getAbsensiHistory', { params: params });
            },
            updateUserProfile: function (payload) {
                this._callApi('updateUserProfile', { payload: payload });
            },
            generatePdfReportBase64: function (params) {
                this._callApi('generatePdfReportBase64', { params: params });
            },
            generateAndSendPdfReport: function (params) {
                this._callApi('generateAndSendPdfReport', { params: params });
            },
            getAdminUserControlData: function () {
                this._callApi('getAdminUserControlData', {});
            },
            registerUser: function (payload) {
                this._callApi('registerUser', { payload: payload });
            }
        };
    }

    let isFirstGpsLockAcquired = false;
    const isGoogleScriptAvailable = true;

    document.addEventListener('DOMContentLoaded', function () {
        lucide.createIcons();
        initLocation();
        checkSession();
    });

    function parseCoordinateLocal(val, defaultVal) {
        if (val === null || val === undefined || val === '') return defaultVal;
        let cleanStr = String(val).trim().replace(',', '.');
        let num = parseFloat(cleanStr);
        return isNaN(num) ? defaultVal : num;
    }

    /**
     * Inisialisasi Lokasi Dua Tahap (Two-Tier Geolocation)
     * Sangat stabil dan kompatibel penuh dengan iOS Safari, Android, dan Desktop
     */
    function initLocation(forcePrompt) {
        if (!navigator.geolocation) {
            const gpsLocEl = document.getElementById('current-gps-loc');
            if (gpsLocEl) gpsLocEl.innerText = 'GPS Tidak Didukung Browser';
            return;
        }

        if (forcePrompt) {
            isFirstGpsLockAcquired = false;
        }

        const gpsLocEl = document.getElementById('current-gps-loc');
        if (gpsLocEl && !isFirstGpsLockAcquired) {
            gpsLocEl.innerText = 'Mencari sinyal GPS...';
        }

        // TAHAP 1: Quick Fix (Coarse Location via Wi-Fi/Cell Tower)
        // maximumAge 60s & timeout 15s agar iOS Safari tidak timeout saat cold-start GPS
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                applyPositionUpdate(pos);
                // TAHAP 2: Aktifkan pemantauan berkelanjutan dengan akurasi satelit tinggi
                startWatchPosition();
            },
            function (err) {
                // Jika quick-fix gagal/timeout, tetap coba jalankan watchPosition
                startWatchPosition();
            },
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
    }

    function startWatchPosition() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
        }

        locationWatchId = navigator.geolocation.watchPosition(
            function (pos) {
                applyPositionUpdate(pos);
            },
            function (err) {
                handleLocationError(err);
            },
            { enableHighAccuracy: true, timeout: 25000, maximumAge: 5000 }
        );
    }

    function applyPositionUpdate(pos) {
        if (!pos || !pos.coords) return;
        isFirstGpsLockAcquired = true;
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        currentGeoLocation = lat.toFixed(7) + ',' + lng.toFixed(7);
        const gpsLocEl = document.getElementById('current-gps-loc');
        if (gpsLocEl) {
            gpsLocEl.innerText = currentGeoLocation;
        }
        updateDistancePill(lat, lng);
    }

    function handleLocationError(err) {
        // Jika kita SUDAH pernah mendapatkan koordinat asli pengguna, jangan ditimpa dengan error
        if (isFirstGpsLockAcquired) {
            return;
        }

        const gpsLocEl = document.getElementById('current-gps-loc');
        if (!gpsLocEl) return;

        if (err && err.code === 1) { // PERMISSION_DENIED
            gpsLocEl.innerText = 'Izin Lokasi Ditolak (Buka Safari Settings)';
            showToast('Aktifkan izin lokasi di Pengaturan iPhone > Safari > Lokasi!', 'error');
        } else if (err && err.code === 2) { // POSITION_UNAVAILABLE
            gpsLocEl.innerText = 'Sinyal GPS Lemah (Nyalakan Lokasi Tepat)';
        } else if (err && err.code === 3) { // TIMEOUT
            // Timeout pada high-accuracy: coba fallback low-accuracy
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    applyPositionUpdate(pos);
                },
                function () {
                    gpsLocEl.innerText = SCHOOL_LAT.toFixed(7) + ',' + SCHOOL_LNG.toFixed(7) + ' (Default)';
                    updateDistancePill(SCHOOL_LAT, SCHOOL_LNG);
                },
                { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 }
            );
            return;
        } else {
            gpsLocEl.innerText = SCHOOL_LAT.toFixed(7) + ',' + SCHOOL_LNG.toFixed(7) + ' (Default)';
        }
        updateDistancePill(SCHOOL_LAT, SCHOOL_LNG);
    }

    function updateDistancePill(userLat, userLng) {
        if (userLat === undefined || userLng === undefined) {
            if (currentGeoLocation && currentGeoLocation.includes(',')) {
                const parts = currentGeoLocation.split(',');
                userLat = parseCoordinateLocal(parts[0], SCHOOL_LAT);
                userLng = parseCoordinateLocal(parts[1], SCHOOL_LNG);
            } else {
                userLat = SCHOOL_LAT;
                userLng = SCHOOL_LNG;
            }
        }

        currentDistanceMeters = calculateDistanceLocal(userLat, userLng, SCHOOL_LAT, SCHOOL_LNG);
        const distPill = document.getElementById('gps-distance-pill');

        if (!distPill) return;

        if (!isGeofenceActive) {
            distPill.innerText = 'GPS OFF';
            distPill.className = 'px-2.5 py-1 text-[10px] font-bold rounded-full bg-slate-100 text-slate-600 shrink-0';
        } else {
            distPill.innerText = Math.round(currentDistanceMeters) + ' m';
            if (currentDistanceMeters <= MAX_RADIUS_METERS) {
                distPill.className = 'px-2.5 py-1 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700 shrink-0';
            } else {
                distPill.className = 'px-2.5 py-1 text-[10px] font-bold rounded-full bg-rose-100 text-rose-600 shrink-0';
            }
        }
    }

    function calculateDistanceLocal(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function checkSession() {
        const saved = localStorage.getItem('zettbot_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            showMainApp();
        } else {
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('view-main').classList.add('hidden');
        }
    }

    // ROLE SELECTOR & DROPDOWN LOGIC
    function selectLoginRole(role) {
        const inputRole = document.getElementById('login-role');
        if (inputRole) inputRole.value = role;

        const btnAdmin = document.getElementById('role-btn-admin');
        const btnDropdown = document.getElementById('role-btn-dropdown');
        const menuDropdown = document.getElementById('role-dropdown-menu');
        const labelDropdown = document.getElementById('role-dropdown-label');
        const iconDropdown = document.getElementById('role-dropdown-icon');
        const chevron = document.getElementById('role-chevron');

        if (menuDropdown) menuDropdown.classList.add('hidden');
        if (chevron) chevron.classList.remove('rotate-180');

        if (role === 'Admin') {
            if (btnAdmin) btnAdmin.classList.add('active-role');
            if (btnDropdown) btnDropdown.classList.remove('active-role');
        } else {
            if (btnAdmin) btnAdmin.classList.remove('active-role');
            if (btnDropdown) btnDropdown.classList.add('active-role');
            if (labelDropdown) labelDropdown.innerText = role;

            if (iconDropdown) {
                let iconName = 'graduation-cap';
                if (role === 'Pimpinan') iconName = 'user-check';
                if (role === 'Staff') iconName = 'briefcase';
                iconDropdown.setAttribute('data-lucide', iconName);
                if (window.lucide) lucide.createIcons();
            }
        }
    }

    function toggleRoleDropdown(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('role-dropdown-menu');
        const chevron = document.getElementById('role-chevron');
        if (menu) {
            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                if (chevron) chevron.classList.add('rotate-180');
            } else {
                menu.classList.add('hidden');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        }
    }

    document.addEventListener('click', function (e) {
        const menu = document.getElementById('role-dropdown-menu');
        const btnDropdown = document.getElementById('role-btn-dropdown');
        if (menu && !menu.classList.contains('hidden')) {
            if (btnDropdown && !btnDropdown.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
                const chevron = document.getElementById('role-chevron');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        }
    });

    function handleLogin() {
        const id = document.getElementById('login-id').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        const role = document.getElementById('login-role') ? document.getElementById('login-role').value : 'Admin';

        if (!id || !pass) {
            showToast('Isi Username/Email dan Password!', 'error');
            return;
        }

        showToast('Memeriksa kredensial...', 'info');

        if (isGoogleScriptAvailable) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        currentUser = res.user;
                        localStorage.setItem('zettbot_user', JSON.stringify(currentUser));
                        showToast('Login berhasil sebagai ' + (currentUser.role || role) + '!', 'success');
                        showMainApp();
                    } else {
                        showToast(res.message, 'error');
                    }
                })
                .withFailureHandler(function (err) {
                    showToast('Gagal terhubung ke server: ' + err.toString(), 'error');
                })
                .loginUser(id, pass, role);
        } else {
            let mockName = 'Budi Santoso, M.Pd';
            let mockEmail = 'dosen@alfarabi.ac.id';
            let mockId = 'USR-0003';
            if (role === 'Admin') {
                mockName = 'Admin Utama';
                mockEmail = 'admin@alfarabi.ac.id';
                mockId = 'USR-0001';
            } else if (role === 'Pimpinan') {
                mockName = 'Dr. H. Ahmad Fauzi, M.Ag';
                mockEmail = 'pimpinan@alfarabi.ac.id';
                mockId = 'USR-0002';
            } else if (role === 'Staff') {
                mockName = 'Dewi Lestari, S.Kom';
                mockEmail = 'staff@alfarabi.ac.id';
                mockId = 'USR-0004';
            }

            currentUser = {
                idUser: mockId,
                nip: id.includes('@') ? '199002022015022002' : id,
                nama: mockName,
                email: id.includes('@') ? id : mockEmail,
                role: role,
                fotoProfil: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=250'
            };
            localStorage.setItem('zettbot_user', JSON.stringify(currentUser));
            showToast('Login Berhasil sebagai ' + role + '!', 'success');
            showMainApp();
        }
    }

    function handleLogout() {
        localStorage.removeItem('zettbot_user');
        currentUser = null;
        document.getElementById('view-main').classList.add('hidden');
        document.getElementById('view-login').classList.remove('hidden');
    }

    function showMainApp() {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');

        document.getElementById('user-display-name').innerText = currentUser.nama;
        const userSubtitle = (currentUser.nip && currentUser.nip !== 'undefined') ? (currentUser.email + ' • ' + currentUser.nip) : currentUser.email;
        document.getElementById('user-display-info').innerText = userSubtitle;
        document.getElementById('user-role-badge').innerText = currentUser.role;

        if (currentUser.fotoProfil) {
            document.getElementById('user-avatar').src = currentUser.fotoProfil;
            document.getElementById('edit-profile-preview').src = currentUser.fotoProfil;
        }

        document.getElementById('edit-nama').value = currentUser.nama;
        document.getElementById('edit-email').value = currentUser.email;
        document.getElementById('edit-foto').value = currentUser.fotoProfil || '';

        const adminWidget = document.getElementById('admin-user-widget');
        if (currentUser.role === 'Admin') {
            document.getElementById('nav-laporan').classList.remove('hidden');
            if (adminWidget) {
                adminWidget.classList.remove('hidden');
                loadAdminUserStats();
            }
        } else {
            document.getElementById('nav-laporan').classList.add('hidden');
            if (adminWidget) {
                adminWidget.classList.add('hidden');
            }
        }

        const now = new Date();
        document.getElementById('today-date-badge').innerText = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

        loadSystemSettingsData();
        loadTodayData();
        switchTab('beranda');
    }

    function loadSystemSettingsData() {
        // 1. DIBACA TERLEBIH DAHULU DARI LOCAL CACHE (INSTAN 0 MILIDETIK)
        const cachedSettings = localStorage.getItem('zettbot_settings');
        if (cachedSettings) {
            try {
                const parsed = JSON.parse(cachedSettings);
                SCHOOL_LAT = parseCoordinateLocal(parsed.lat, SCHOOL_LAT);
                SCHOOL_LNG = parseCoordinateLocal(parsed.lng, SCHOOL_LNG);
                MAX_RADIUS_METERS = parseInt(parsed.radius, 10) || MAX_RADIUS_METERS;
                isGeofenceActive = parsed.isActive;

                document.getElementById('setting-lat').value = SCHOOL_LAT;
                document.getElementById('setting-lng').value = SCHOOL_LNG;
                document.getElementById('setting-radius').value = MAX_RADIUS_METERS;
                document.getElementById('setting-toggle-geofence').checked = isGeofenceActive;
                toggleGeofenceBadge(isGeofenceActive);
                updateDistancePill();
            } catch (e) {
                console.warn('Cache settings invalid:', e);
            }
        }

        // 2. VERIFIKASI SINKRONISASI LATAR BELAKANG DENGAN SERVER
        if (isGoogleScriptAvailable) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success && res.settings) {
                        SCHOOL_LAT = parseCoordinateLocal(res.settings.lat, SCHOOL_LAT);
                        SCHOOL_LNG = parseCoordinateLocal(res.settings.lng, SCHOOL_LNG);
                        MAX_RADIUS_METERS = parseInt(res.settings.radius, 10) || MAX_RADIUS_METERS;
                        isGeofenceActive = res.settings.isActive;

                        // Simpan ke Local Cache Storage
                        localStorage.setItem('zettbot_settings', JSON.stringify({
                            lat: SCHOOL_LAT,
                            lng: SCHOOL_LNG,
                            radius: MAX_RADIUS_METERS,
                            isActive: isGeofenceActive
                        }));

                        document.getElementById('setting-lat').value = SCHOOL_LAT;
                        document.getElementById('setting-lng').value = SCHOOL_LNG;
                        document.getElementById('setting-radius').value = MAX_RADIUS_METERS;
                        document.getElementById('setting-toggle-geofence').checked = isGeofenceActive;
                        toggleGeofenceBadge(isGeofenceActive);
                        updateDistancePill();

                        if (adminMap) {
                            adminMap.setView([SCHOOL_LAT, SCHOOL_LNG], 16);
                            if (adminMarker) adminMarker.setLatLng([SCHOOL_LAT, SCHOOL_LNG]);
                            updateRadiusCircle();
                        }
                    }
                })
                .getSystemSettings();
        } else {
            document.getElementById('setting-lat').value = SCHOOL_LAT;
            document.getElementById('setting-lng').value = SCHOOL_LNG;
            document.getElementById('setting-radius').value = MAX_RADIUS_METERS;
            document.getElementById('setting-toggle-geofence').checked = isGeofenceActive;
            toggleGeofenceBadge(isGeofenceActive);
            updateDistancePill();
        }
    }

    function toggleGeofenceBadge(checked) {
        isGeofenceActive = checked;
        const badge = document.getElementById('badge-geofence-status');
        if (badge) {
            if (checked) {
                badge.innerText = 'AKTIF';
                badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700';
            } else {
                badge.innerText = 'NON-AKTIF';
                badge.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600';
            }
        }
        updateDistancePill();
    }

    function initAdminMap() {
        if (typeof L === 'undefined' || !document.getElementById('admin-map')) return;

        adminMap = L.map('admin-map').setView([SCHOOL_LAT, SCHOOL_LNG], 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(adminMap);

        adminMarker = L.marker([SCHOOL_LAT, SCHOOL_LNG], { draggable: true }).addTo(adminMap);

        adminMarker.on('dragend', function (e) {
            const pos = e.target.getLatLng();
            const newLat = parseFloat(pos.lat.toFixed(7));
            const newLng = parseFloat(pos.lng.toFixed(7));

            SCHOOL_LAT = newLat;
            SCHOOL_LNG = newLng;
            document.getElementById('setting-lat').value = newLat;
            document.getElementById('setting-lng').value = newLng;

            updateRadiusCircle();
            updateDistancePill();
        });

        updateRadiusCircle();
    }

    function updateRadiusCircle() {
        const lat = parseCoordinateLocal(document.getElementById('setting-lat').value, SCHOOL_LAT);
        const lng = parseCoordinateLocal(document.getElementById('setting-lng').value, SCHOOL_LNG);
        const rad = parseInt(document.getElementById('setting-radius').value, 10) || MAX_RADIUS_METERS;

        if (adminCircle) {
            adminCircle.setLatLng([lat, lng]);
            adminCircle.setRadius(rad);
        } else if (adminMap) {
            adminCircle = L.circle([lat, lng], {
                color: '#1a64f6',
                fillColor: '#1a64f6',
                fillOpacity: 0.18,
                radius: rad
            }).addTo(adminMap);
        }
    }

    function updateMapFromInputs() {
        const lat = parseCoordinateLocal(document.getElementById('setting-lat').value, null);
        const lng = parseCoordinateLocal(document.getElementById('setting-lng').value, null);
        const rad = parseInt(document.getElementById('setting-radius').value, 10);

        if (lat !== null && lng !== null && adminMap && adminMarker) {
            SCHOOL_LAT = lat;
            SCHOOL_LNG = lng;
            adminMarker.setLatLng([lat, lng]);
            adminMap.panTo([lat, lng]);
            updateDistancePill();
        }

        if (!isNaN(rad)) {
            MAX_RADIUS_METERS = rad;
            updateDistancePill();
        }

        updateRadiusCircle();
    }

    function searchLocationOnMap() {
        const query = document.getElementById('setting-search-map').value.trim();
        if (!query) {
            showToast('Masukkan nama lokasi / alamat!', 'error');
            return;
        }

        showToast('Mencari lokasi...', 'info');

        fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);

                    SCHOOL_LAT = parseCoordinateLocal(lat.toFixed(7), SCHOOL_LAT);
                    SCHOOL_LNG = parseCoordinateLocal(lon.toFixed(7), SCHOOL_LNG);

                    document.getElementById('setting-lat').value = SCHOOL_LAT;
                    document.getElementById('setting-lng').value = SCHOOL_LNG;

                    if (adminMap) {
                        adminMap.setView([SCHOOL_LAT, SCHOOL_LNG], 16);
                        if (adminMarker) adminMarker.setLatLng([SCHOOL_LAT, SCHOOL_LNG]);
                        updateRadiusCircle();
                    }

                    updateDistancePill();
                    showToast('Lokasi ditemukan: ' + data[0].display_name.split(',')[0], 'success');

    function tryAccessCamera(optionsList, index) {
        if (index >= optionsList.length || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            document.getElementById('camera-loading-text').classList.add('hidden');
            document.getElementById('webcam-video').classList.add('hidden');
            document.getElementById('camera-fallback-notice').classList.remove('hidden');

            document.getElementById('btn-snap').classList.add('hidden');
            document.getElementById('btn-native-cam').classList.remove('hidden');
            return;
        }

        navigator.mediaDevices.getUserMedia(optionsList[index])
            .then(function (stream) {
                webcamStream = stream;
                const video = document.getElementById('webcam-video');
                video.classList.remove('hidden');
                video.srcObject = stream;
                video.play().then(function () {
                    document.getElementById('camera-loading-text').classList.add('hidden');
                }).catch(function () {
                    document.getElementById('camera-loading-text').classList.add('hidden');
                });
            })
            .catch(function (err) {
                console.warn('Option ' + index + ' failed, trying fallback...', err);
                tryAccessCamera(optionsList, index + 1);
            });
    }

    function handleNativeCameraCapture(event) {
        const file = event.target.files[0];
        if (!file) return;

        showToast('Memproses foto selfie...', 'info');

        const reader = new FileReader();
        reader.onload = function (e) {
            const img = new Image();
            img.onload = function () {
                const canvas = document.getElementById('webcam-canvas');
                const maxDim = 640;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    }
                } else {
                    if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

                const preview = document.getElementById('selfie-preview');
                preview.src = capturedPhotoBase64;

                document.getElementById('webcam-video').classList.add('hidden');
                document.getElementById('camera-fallback-notice').classList.add('hidden');
                preview.classList.remove('hidden');

                document.getElementById('btn-snap').classList.add('hidden');
                document.getElementById('btn-native-cam').classList.add('hidden');
                document.getElementById('btn-retake').classList.remove('hidden');
                document.getElementById('btn-submit-absen').classList.remove('hidden');

                showToast('Foto selfie berhasil diambil!', 'success');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function downloadPdfFromBase64(base64Data, filename) {
        const byteCharacters = atob(base64Data);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename || 'Laporan_Kehadiran.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(link.href); }, 2000);
    }

        const toastMsg = document.getElementById('toast-message');

        toastMsg.innerText = msg;
        toast.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl text-xs font-semibold shadow-xl text-white transition-all duration-300 ';

        if (type === 'error') toast.classList.add('bg-rose-600');
        else if (type === 'success') toast.classList.add('bg-emerald-600');
        else toast.classList.add('bg-[#1a64f6]');

        toast.classList.remove('hidden');
        setTimeout(function () {
            toast.classList.add('hidden');
        }, 3200);
    }

    // =========================================================================
    // MODUL KONTROL & MONITORING USER TERDAFTAR (KHUSUS ADMIN)
    // =========================================================================
    let cachedAdminUsers = [];

    function loadAdminUserStats(isForced) {
        if (!currentUser || currentUser.role !== 'Admin') return;

        if (isForced) {
            showToast('Memperbarui data pengguna...', 'info');
        }

        if (isGoogleScriptAvailable) {
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.success) {
                        updateAdminUserUI(res.stats, res.users);
                        if (isForced) showToast('Data pengguna berhasil disegarkan!', 'success');
                    } else {
                        showToast(res && res.message ? res.message : 'Gagal memuat statistik pengguna', 'error');
                    }
                })
                .withFailureHandler(function (err) {
                    showToast('Kesalahan server: ' + err, 'error');
                })
                .getAdminUserControlData();
        } else {
            // Mock Data Fallback untuk Local Preview
            const mockStats = { total: 4, dosen: 1, staff: 1, pimpinan: 1, admin: 1 };
            const mockUsers = [
                { idUser: 'USR-0001', nip: '198501012010011001', nama: 'Admin Utama', email: 'admin@alfarabi.ac.id', role: 'Admin', createdAt: '12/10/2026 08:00:00' },
                { idUser: 'USR-0002', nip: '198008152005011003', nama: 'Dr. H. Ahmad Fauzi, M.Ag', email: 'pimpinan@alfarabi.ac.id', role: 'Pimpinan', createdAt: '12/10/2026 08:15:00' },
                { idUser: 'USR-0003', nip: '199002022015022002', nama: 'Budi Santoso, M.Pd', email: 'dosen@alfarabi.ac.id', role: 'Dosen', createdAt: '12/10/2026 08:30:00' },
                { idUser: 'USR-0004', nip: '199506102020122005', nama: 'Dewi Lestari, S.Kom', email: 'staff@alfarabi.ac.id', role: 'Staff', createdAt: '12/10/2026 09:00:00' }
            ];
            updateAdminUserUI(mockStats, mockUsers);
            if (isForced) showToast('Data pengguna disegarkan (Preview Mode)', 'success');
        }
    }

    function updateAdminUserUI(stats, users) {
        stats = stats || { total: 0, dosen: 0, staff: 0, pimpinan: 0, admin: 0 };
        cachedAdminUsers = users || [];

        const elTotal = document.getElementById('stat-total-user');
        const elDosen = document.getElementById('stat-dosen-user');
        const elStaff = document.getElementById('stat-staff-user');
        const elPimpinan = document.getElementById('stat-pimpinan-user');

        if (elTotal) elTotal.innerText = stats.total || 0;
        if (elDosen) elDosen.innerText = stats.dosen || 0;
        if (elStaff) elStaff.innerText = stats.staff || 0;
        if (elPimpinan) elPimpinan.innerText = stats.pimpinan || 0;

        const elModalCount = document.getElementById('admin-user-modal-count');
        if (elModalCount) {
            elModalCount.innerText = 'Total: ' + cachedAdminUsers.length + ' Pengguna';
        }

        const modal = document.getElementById('modal-admin-user-list');
        if (modal && !modal.classList.contains('hidden')) {
            const searchInput = document.getElementById('search-admin-user');
            const kw = searchInput ? searchInput.value : '';
            filterAdminUserList(kw);
        }
    }

    function openAdminUserModal() {
        if (!currentUser || currentUser.role !== 'Admin') return;

        const modal = document.getElementById('modal-admin-user-list');
        const searchInput = document.getElementById('search-admin-user');
        if (searchInput) searchInput.value = '';

        if (modal) modal.classList.remove('hidden');

        if (cachedAdminUsers && cachedAdminUsers.length > 0) {
            renderAdminUserList(cachedAdminUsers);
        } else {
            loadAdminUserStats(false);
        }

        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeAdminUserModal() {
        const modal = document.getElementById('modal-admin-user-list');
        if (modal) modal.classList.add('hidden');
    }

    function filterAdminUserList(keyword) {
        if (!keyword || keyword.trim() === '') {
            renderAdminUserList(cachedAdminUsers);
            return;
        }

        const q = keyword.toLowerCase().trim();
        const filtered = cachedAdminUsers.filter(function (u) {
            const nama = (u.nama || '').toLowerCase();
            const nip = (u.nip || '').toLowerCase();
            const email = (u.email || '').toLowerCase();
            const role = (u.role || '').toLowerCase();
            const id = (u.idUser || '').toLowerCase();
            return nama.includes(q) || nip.includes(q) || email.includes(q) || role.includes(q) || id.includes(q);
        });

        renderAdminUserList(filtered);
    }

    function renderAdminUserList(users) {
        const container = document.getElementById('admin-user-list-container');
        if (!container) return;

        if (!users || users.length === 0) {
            container.innerHTML = 
                '<div class="py-8 text-center text-gray-400">' +
                '  <div class="w-11 h-11 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-2 text-gray-400">' +
                '    <i data-lucide="user-x" class="w-5 h-5"></i>' +
                '  </div>' +
                '  <p class="font-medium text-xs text-gray-500">Tidak ada data pengguna ditemukan.</p>' +
                '  <p class="text-[10px] text-gray-400 mt-0.5">Silakan periksa kembali kata kunci pencarian Anda.</p>' +
                '</div>';
            if (typeof lucide !== 'undefined') lucide.createIcons();
            return;
        }

        let html = '';
        users.forEach(function (u) {
            let roleBadgeClass = 'bg-gray-100 text-gray-700 border-gray-200';
            const role = String(u.role || 'Dosen').trim();
            const roleLower = role.toLowerCase();

            if (roleLower === 'admin') {
                roleBadgeClass = 'bg-purple-50 text-purple-700 border-purple-200';
            } else if (roleLower === 'pimpinan') {
                roleBadgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
            } else if (roleLower === 'dosen' || roleLower === 'guru') {
                roleBadgeClass = 'bg-blue-50 text-[#1a64f6] border-blue-200';
            } else if (roleLower === 'staff' || roleLower === 'staf') {
                roleBadgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
            }

            const avatarSrc = (u.fotoProfil && u.fotoProfil.trim() !== '') 
                ? u.fotoProfil 
                : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150';

            html += 
                '<div class="p-3 bg-white hover:bg-slate-50/80 border border-slate-200/80 rounded-2xl transition duration-150 shadow-sm flex items-start space-x-3">' +
                '  <img src="' + avatarSrc + '" alt="' + (u.nama || 'User') + '" class="w-10 h-10 rounded-full object-cover border border-slate-200 shrink-0 mt-0.5">' +
                '  <div class="flex-1 min-w-0">' +
                '    <div class="flex items-center justify-between gap-1 mb-1">' +
                '      <h4 class="font-bold text-xs text-gray-900 truncate leading-snug">' + (u.nama || '-') + '</h4>' +
                '      <span class="px-2 py-0.5 text-[9px] font-extrabold rounded-full border shrink-0 ' + roleBadgeClass + '">' + role + '</span>' +
                '    </div>' +
                '    <div class="space-y-0.5 text-[11px] text-gray-500">' +
                '      <div class="flex items-center space-x-1.5 truncate">' +
                '        <i data-lucide="badge-check" class="w-3.5 h-3.5 text-gray-400 shrink-0"></i>' +
                '        <span class="font-mono text-gray-700 font-medium truncate">NIP: ' + (u.nip || '-') + '</span>' +
                '      </div>' +
                '      <div class="flex items-center space-x-1.5 truncate">' +
                '        <i data-lucide="mail" class="w-3.5 h-3.5 text-gray-400 shrink-0"></i>' +
                '        <span class="text-gray-600 truncate">' + (u.email || '-') + '</span>' +
                '      </div>' +
                '      <div class="flex items-center justify-between pt-1 text-[10px] text-gray-400 border-t border-slate-100 mt-1">' +
                '        <span class="font-mono text-slate-400">ID: ' + (u.idUser || '-') + '</span>' +
                '        <span>' + (u.createdAt ? u.createdAt.split(' ')[0] : '') + '</span>' +
                '      </div>' +
                '    </div>' +
                '  </div>' +
                '</div>';
        });

        container.innerHTML = html;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
</script>
