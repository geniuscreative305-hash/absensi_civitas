<!-- Google Fonts & Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Leaflet Map CSS & JS (Free, Interactive & Lightweight) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    * {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden !important;
        position: relative;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
        background-color: #f0f4fd;
        color: #1e293b;
    }

    .header-banner {
        background: linear-gradient(135deg, #1a64f6 0%, #0d42b3 100%);
    }

    .card-soft {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(26, 100, 246, 0.06);
    }

    .btn-masuk {
        background-color: #1a64f6;
        transition: all 0.2s ease;
    }

    .btn-masuk:active {
        transform: scale(0.97);
        background-color: #124ec4;
    }

    .btn-pulang {
        background-color: #f43f5e;
        transition: all 0.2s ease;
    }

    .btn-pulang:active {
        transform: scale(0.97);
        background-color: #e11d48;
    }

    .nav-item.active {
        color: #1a64f6;
        font-weight: 700;
    }

    .nav-item.active i {
        stroke: #1a64f6;
    }

    .leaflet-container {
        border-radius: 12px;
        z-index: 10 !important;
    }

    ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
    }

    ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }

    /* DARK LOGIN & ROLE SELECTOR STYLES */
    .role-option-btn {
        background-color: #111a2d;
        color: #94a3b8;
        border-color: #1f2b42;
        transition: all 0.2s ease-in-out;
    }

    .role-option-btn:hover {
        border-color: #334155;
    }

    .role-option-btn.active-role {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #ffffff !important;
        box-shadow: 0 0 22px rgba(59, 130, 246, 0.45) !important;
        font-weight: 700 !important;
    }

    .role-option-btn.active-role i {
        color: #2563eb !important;
    }
</style>
